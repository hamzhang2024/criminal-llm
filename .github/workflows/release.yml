name: Release Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v1.0.10)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.platform.os }} (${{ matrix.platform.target }})
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            tauri-args: ""
          - os: macos-14
            target: aarch64-apple-darwin
            tauri-args: "--target aarch64-apple-darwin"
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            # 禁用 AppImage：v1.6.11 onedir 打包后 linuxdeploy 失败，
            # 导致整个 Linux job fail、deb/rpm 也无法上传。用户用 deb/rpm 即可。
            tauri-args: "--bundles deb,rpm"

    runs-on: ${{ matrix.platform.os }}
    steps:
      - uses: actions/checkout@v4

      # ---- macOS 证书（可选） ----
      - name: Import macOS signing certificate
        if: matrix.platform.os == 'macos-14' && env.MACOS_CERT_BASE64 != ''
        env:
          MACOS_CERT_BASE64: ${{ secrets.MACOS_SIGNING_CERTIFICATE }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
          MACOS_CERT_NAME: ${{ secrets.MACOS_CERTIFICATE_NAME }}
        run: |
          echo "导入 macOS 签名证书..."
          echo $MACOS_CERT_BASE64 | base64 --decode > certificate.p12
          security create-keychain -p actions temp.keychain
          security import certificate.p12 -k temp.keychain -P $MACOS_CERT_PASSWORD -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions temp.keychain
          security list-keychains -d user -s temp.keychain

      # ---- Windows 证书（可选） ----
      - name: Import Windows signing certificate
        if: matrix.platform.os == 'windows-latest' && env.WINDOWS_CERT_BASE64 != ''
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          echo "导入 Windows 签名证书..."
          [System.IO.File]::WriteAllBytes("certificate.pfx", [System.Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))

      # ---- Rust ----
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      # ---- Linux 依赖 ----
      - name: Install Linux dependencies
        if: matrix.platform.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      # ---- Node ----
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # ---- Python (backend) ----
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # ---- Frontend deps ----
      - name: Install frontend deps
        working-directory: frontend
        run: |
          npm install

      # ---- Backend deps（用锁文件保证可复现） ----
      - name: Install backend deps
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements-lock.txt
          # pyinstaller 是打包工具，不进运行时锁文件，单独安装
          pip install "pyinstaller>=6.20.0"

      # ---- 打包前校验：兼容性 + 模块完整性 + lazy import 安全 ----
      - name: Prebuild check (compatibility + module integrity + lazy import safety)
        shell: bash
        run: |
          # prebuild_check 区分两类：
          #   ⚠️ warning（兼容性：硬编码路径/外部命令/print）—— 不阻断
          #   ❌ fatal（模块完整性/第三方依赖/PEP562 lazy NameError）—— 阻断
          # 旧逻辑只 grep ModuleNotFoundError，会漏掉 lazy import 类致命问题；
          # 现改为：输出含 ❌ 即 exit 1。|| true 防止 python 异常直接 fail（grep 兜底）。
          CHECK_OUTPUT="$(python scripts/prebuild_check.py 2>&1)" || true
          echo "$CHECK_OUTPUT"
          if echo "$CHECK_OUTPUT" | grep -q "❌"; then
            echo "❌ 打包前致命检查失败，终止打包（见上方 ❌ 标记）"
            exit 1
          fi
          echo "✅ 打包前致命检查通过（兼容性警告 ⚠️ 不阻断）"

      # ---- Build frontend ----
      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # ---- Build backend ----
      - name: Build backend
        shell: bash
        run: |
          cd backend
          rm -rf build dist
          python -m PyInstaller --noconfirm criminal-llm.spec

      # ---- Copy backend build to Tauri resources ----
      - name: Prepare backend resources
        shell: bash
        run: |
          RES_DIR="frontend/src-tauri/resources/backend"
          mkdir -p "$RES_DIR"

          # 复制 PyInstaller 输出
          if [ "${{ matrix.platform.os }}" = "windows-latest" ]; then
            # Windows: PyInstaller onedir 生成 dist/criminal-llm/ 目录（exe + _internal/）
            cp -r backend/dist/criminal-llm/* "$RES_DIR/" 2>/dev/null || true
          else
            # macOS/Linux: PyInstaller 生成 dist/criminal-llm 目录
            if [ -d "backend/dist/criminal-llm" ]; then
              cp -r backend/dist/criminal-llm/* "$RES_DIR/" 2>/dev/null || true
            else
              # 某些配置可能生成单文件
              cp backend/dist/criminal-llm "$RES_DIR/" 2>/dev/null || true
            fi
          fi

          # 确保 legal_db 存在（从 backend/legal_db 复制）
          if [ -d "$RES_DIR/legal_db" ]; then
            echo "✅ legal_db 已在打包产物中"
          else
            echo "📋 复制 legal_db 到 resources..."
            cp -r backend/legal_db "$RES_DIR/" 2>/dev/null || echo "⚠️ legal_db 复制失败"
          fi

          # macOS/Linux: 设置执行权限
          if [ "${{ matrix.platform.os }}" != "windows-latest" ]; then
            chmod +x "$RES_DIR/criminal-llm" 2>/dev/null || true
            echo "✅ 已设置后端可执行权限"
          fi

          # 列出资源目录内容
          echo "📋 后端资源目录内容:"
          ls -la "$RES_DIR/" 2>/dev/null || dir "$RES_DIR"

      # ---- 验证构建完整性 ----
      - name: Verify build integrity
        shell: bash
        run: |
          echo "=== 验证后端构建产物 ==="
          RES_DIR="frontend/src-tauri/resources/backend"
          if [ "${{ matrix.platform.os }}" = "windows-latest" ]; then
            EXEC="$RES_DIR/criminal-llm.exe"
          else
            EXEC="$RES_DIR/criminal-llm"
          fi
          if [ -f "$EXEC" ]; then
            SIZE=$(stat -f%z "$EXEC" 2>/dev/null || stat -c%s "$EXEC" 2>/dev/null)
            echo "后端可执行文件: $EXEC ($SIZE bytes)"
            # onedir 打包：exe 只含 bootloader（~10MB），依赖在同级 _internal/ 目录
            if [ -d "$RES_DIR/_internal" ]; then
              echo "✅ onedir _internal/ 依赖目录存在"
            elif [ "$SIZE" -lt 10485760 ]; then
              echo "❌ 可执行文件小于 10MB 且无 _internal/ 目录，打包可能不完整"
              exit 1
            fi
            echo "✅ 后端构建产物正常"
          else
            echo "❌ 后端可执行文件缺失: $EXEC"
            echo "📋 当前后端资源目录:"
            ls -la "$RES_DIR/" 2>/dev/null || dir "$RES_DIR"
            exit 1
          fi

          echo ""
          echo "=== 验证 legal_db ==="
          if [ -d "$RES_DIR/legal_db" ]; then
            echo "✅ legal_db 目录存在"
            ls "$RES_DIR/legal_db/"
          else
            echo "❌ legal_db 目录缺失!"
            echo "📋 尝试从 backend 复制..."
            if [ -d "backend/legal_db" ]; then
              cp -r backend/legal_db "$RES_DIR/"
              echo "✅ 已复制 legal_db"
            else
              echo "❌ backend/legal_db 也不存在!"
              exit 1
            fi
          fi

          echo ""
          echo "=== 验证前端构建产物 ==="
          if [ -f "frontend/dist/index.html" ]; then
            echo "✅ dist/index.html 存在"
          else
            echo "❌ frontend/dist/index.html 缺失!"
            exit 1
          fi

          echo ""
          echo "=== 全部完整性检查通过 ==="

      # ---- 运行时冒烟测试：真启动打包后的后端，抓启动崩溃 / SSE 500 / NameError ----
      # 防 v1.6.8（aiohttp NameError）/ v1.6.11（sse_starlette 500）类漏网：
      # 静态检查覆盖不到的运行时问题，由本步骤兜底。
      - name: Runtime smoke test (backend boot + SSE health)
        shell: bash
        run: |
          set +e  # 整个步骤手动判定，不因单条命令非零退出
          RES_DIR="frontend/src-tauri/resources/backend"
          if [ "${{ matrix.platform.os }}" = "windows-latest" ]; then
            EXEC="$RES_DIR/criminal-llm.exe"
          else
            EXEC="$RES_DIR/criminal-llm"
          fi

          echo "=== 运行时冒烟测试 ==="
          if [ ! -f "$EXEC" ]; then
            echo "❌ 后端可执行文件不存在: $EXEC"
            exit 1
          fi
          echo "启动后端: $EXEC"

          # 后台启动后端，cwd = exe 所在目录（onedir 模式 bootloader 自动找 _internal/）
          # 日志重定向到 /tmp/be.log 便于失败排查
          (
            cd "$RES_DIR" || exit 1
            if [ "${{ matrix.platform.os }}" = "windows-latest" ]; then
              # Windows git bash: & 后台启动；stdout/stderr 重定向
              ./criminal-llm.exe > /tmp/be.log 2>&1 &
            else
              ./criminal-llm > /tmp/be.log 2>&1 &
            fi
            echo $! > /tmp/be.pid
          )

          # 等 health 就绪（最多 30s）
          HEALTH_OK=0
          for i in $(seq 1 60); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 2 http://127.0.0.1:8080/api/health 2>/dev/null || echo "000")
            if [ "$CODE" = "200" ]; then
              HEALTH_OK=1
              echo "✅ 后端 health 就绪（等待 $((i/2))s）"
              break
            fi
            sleep 0.5
          done

          if [ "$HEALTH_OK" != "1" ]; then
            echo "❌ 后端 /api/health 30s 内未就绪（最后 HTTP code: $CODE）"
            echo "=== 后端启动日志 ==="
            cat /tmp/be.log 2>/dev/null || echo "(无日志)"
            # 内联 kill（cleanup 步骤会再兜底）
            if [ -f /tmp/be.pid ]; then
              PID=$(cat /tmp/be.pid 2>/dev/null)
              if [ -n "$PID" ]; then
                if [ "${{ matrix.platform.os }}" = "windows-latest" ]; then
                  taskkill //F //PID "$PID" 2>/dev/null || true
                else
                  kill -9 "$PID" 2>/dev/null || true
                fi
              fi
            fi
            exit 1
          fi

          # 30 秒存活测试：health 通过后再等 30 秒，确认后端没有悄悄死掉
          # （v1.7.x 系列 bug：后端启动成功但几秒后被 Tauri Job Object 杀掉）
          echo "⏳ 30 秒存活测试..."
          sleep 30
          SURVIVE_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 3 http://127.0.0.1:8080/api/health 2>/dev/null || echo "000")
          if [ "$SURVIVE_CODE" != "200" ]; then
            echo "❌ 后端在 30 秒内死掉了！（health HTTP code: $SURVIVE_CODE）"
            echo "=== 后端完整日志 ==="
            cat /tmp/be.log 2>/dev/null || echo "(无日志)"
            if [ -f /tmp/be.pid ]; then
              PID=$(cat /tmp/be.pid 2>/dev/null)
              if [ -n "$PID" ]; then
                if [ "${{ matrix.platform.os }}" = "windows-latest" ]; then
                  taskkill //F //PID "$PID" 2>/dev/null || true
                else
                  kill -9 "$PID" 2>/dev/null || true
                fi
              fi
            fi
            exit 1
          fi
          echo "✅ 后端 30 秒存活测试通过"

          # SSE 端点冒烟：500 = sse_starlette 缺失 / 路由内 NameError；200/404 都算 OK
          # --max-time 3：SSE 是流式，3s 后强制断开取状态码
          SSE_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 3 \
            http://127.0.0.1:8080/api/tasks/_smoke/convert-status/stream 2>/dev/null || echo "000")
          echo "SSE 端点 HTTP code: $SSE_CODE"
          if [ "$SSE_CODE" = "500" ]; then
            echo "❌ SSE 端点返回 500（疑似 sse_starlette 缺失或路由内 NameError）"
            echo "=== 后端日志（最后 50 行）==="
            tail -50 /tmp/be.log 2>/dev/null || echo "(无日志)"
            if [ -f /tmp/be.pid ]; then
              PID=$(cat /tmp/be.pid 2>/dev/null)
              if [ -n "$PID" ]; then
                if [ "${{ matrix.platform.os }}" = "windows-latest" ]; then
                  taskkill //F //PID "$PID" 2>/dev/null || true
                else
                  kill -9 "$PID" 2>/dev/null || true
                fi
              fi
            fi
            exit 1
          fi
          # 200 或 404 都算通过（404 = 端点存在性差异，不是运行时崩溃）
          if [ "$SSE_CODE" = "200" ] || [ "$SSE_CODE" = "404" ]; then
            echo "✅ SSE 端点正常（$SSE_CODE）"
          else
            echo "⚠️ SSE 端点返回非预期 code: $SSE_CODE（仅告警，不阻断）"
          fi

          echo "=== 冒烟测试通过 ==="

          # 成功路径也要 kill 后端，避免残留进程干扰后续 Tauri build
          if [ -f /tmp/be.pid ]; then
            PID=$(cat /tmp/be.pid 2>/dev/null)
            if [ -n "$PID" ]; then
              if [ "${{ matrix.platform.os }}" = "windows-latest" ]; then
                taskkill //F //PID "$PID" 2>/dev/null || true
              else
                kill -9 "$PID" 2>/dev/null || true
              fi
            fi
            rm -f /tmp/be.pid
          fi

      # 兜底清理：即使冒烟测试步骤被 cancel/失败，也确保后端进程不残留
      - name: Runtime smoke test cleanup
        if: always()
        shell: bash
        run: |
          # 兜底清理：确保后端进程不残留（即使上一步失败）
          if [ -f /tmp/be.pid ]; then
            PID=$(cat /tmp/be.pid 2>/dev/null)
            if [ -n "$PID" ]; then
              if [ "${{ matrix.platform.os }}" = "windows-latest" ]; then
                taskkill //F //PID "$PID" 2>/dev/null || true
              else
                kill -9 "$PID" 2>/dev/null || true
              fi
            fi
            rm -f /tmp/be.pid
          fi
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: frontend/src-tauri
          args: ${{ matrix.platform.tauri-args }}

      # ---- macOS 公证（可选） ----
      - name: Notarize macOS app
        if: matrix.platform.os == 'macos-14' && env.APPLE_ID != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo "开始 macOS 公证..."
          DMG_PATH=$(find frontend/src-tauri/target -name "*.dmg" | head -1)
          if [ -n "$DMG_PATH" ]; then
            xcrun notarytool submit "$DMG_PATH" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
            xcrun stapler staple "$DMG_PATH"
            echo "✅ 公证完成"
          fi

      # ---- Generate checksums ----
      - name: Generate checksums
        shell: bash
        run: |
          echo "=== 生成 SHA256 校验文件 ==="
          cd frontend/src-tauri/target
          # 只保留需要的产物：Windows .msi, macOS .dmg, Linux .deb
          find . -path "*/release/bundle/*" -type f \( -name "*.msi" -o -name "*.dmg" -o -name "*.deb" \) | while read f; do
            echo "$(sha256sum "$f" | head -c 64)  ${f#*/release/bundle/}"
          done | tee checksums.txt
          echo ""
          echo "=== 校验文件内容 ==="
          cat checksums.txt

      # ---- Upload artifacts ----
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            frontend/src-tauri/target/**/release/bundle/**/*.msi
            frontend/src-tauri/target/**/release/bundle/**/*.dmg
            frontend/src-tauri/target/**/release/bundle/**/*.deb
            frontend/src-tauri/target/checksums.txt
          draft: false
          prerelease: false
          generate_release_notes: true
