name: Release Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v1.0.10)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.platform.os }} (${{ matrix.platform.target }})
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            tauri-args: ""
          - os: macos-14
            target: aarch64-apple-darwin
            tauri-args: "--target aarch64-apple-darwin"
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            tauri-args: ""

    runs-on: ${{ matrix.platform.os }}
    steps:
      - uses: actions/checkout@v4

      # ---- macOS 证书（可选） ----
      - name: Import macOS signing certificate
        if: matrix.platform.os == 'macos-14' && env.MACOS_CERT_BASE64 != ''
        env:
          MACOS_CERT_BASE64: ${{ secrets.MACOS_SIGNING_CERTIFICATE }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
          MACOS_CERT_NAME: ${{ secrets.MACOS_CERTIFICATE_NAME }}
        run: |
          echo "导入 macOS 签名证书..."
          echo $MACOS_CERT_BASE64 | base64 --decode > certificate.p12
          security create-keychain -p actions temp.keychain
          security import certificate.p12 -k temp.keychain -P $MACOS_CERT_PASSWORD -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions temp.keychain
          security list-keychains -d user -s temp.keychain

      # ---- Windows 证书（可选） ----
      - name: Import Windows signing certificate
        if: matrix.platform.os == 'windows-latest' && env.WINDOWS_CERT_BASE64 != ''
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          echo "导入 Windows 签名证书..."
          [System.IO.File]::WriteAllBytes("certificate.pfx", [System.Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))

      # ---- Rust ----
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      # ---- Linux 依赖 ----
      - name: Install Linux dependencies
        if: matrix.platform.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      # ---- Node ----
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # ---- Python (backend) ----
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # ---- Frontend deps ----
      - name: Install frontend deps
        working-directory: frontend
        run: |
          npm install

      # ---- Backend deps ----
      - name: Install backend deps
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt

      # ---- Build frontend ----
      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # ---- Build backend ----
      - name: Build backend
        shell: bash
        run: |
          cd backend
          rm -rf build dist
          python -m PyInstaller --noconfirm criminal-llm.spec

      # ---- Copy backend build to Tauri resources ----
      - name: Prepare backend resources
        shell: bash
        run: |
          RES_DIR="frontend/src-tauri/resources/backend"
          rm -rf "$RES_DIR"
          mkdir -p "$RES_DIR"

          # 验证 PyInstaller 输出存在
          if [ ! -d "backend/dist/criminal-llm" ]; then
            echo "❌ PyInstaller 输出目录不存在: backend/dist/criminal-llm"
            echo "📋 backend/dist/ 内容:"
            ls -la backend/dist/ 2>/dev/null || echo "backend/dist/ 也不存在"
            exit 1
          fi

          # onedir 模式：复制二进制 + _internal/
          cp -r backend/dist/criminal-llm/* "$RES_DIR/"
          echo "✅ 后端资源已复制"
          ls -la "$RES_DIR/" | head -10

          # 确保 legal_db 存在（从 backend/legal_db 复制）
          if [ -d "$RES_DIR/legal_db" ]; then
            echo "✅ legal_db 已在打包产物中"
          else
            echo "📋 复制 legal_db 到 resources..."
            cp -r backend/legal_db "$RES_DIR/" 2>/dev/null || echo "⚠️ legal_db 复制失败"
          fi

          # macOS/Linux: 设置执行权限
          if [ "${{ matrix.platform.os }}" != "windows-latest" ]; then
            chmod +x "$RES_DIR/criminal-llm" 2>/dev/null || true
            echo "✅ 已设置后端可执行权限"
          fi

          # 列出资源目录内容
          echo "📋 后端资源目录内容:"
          ls -la "$RES_DIR/" 2>/dev/null || dir "$RES_DIR"

      # ---- 验证构建完整性 ----
      - name: Verify build integrity
        shell: bash
        run: |
          echo "=== 验证后端构建产物 ==="
          RES_DIR="frontend/src-tauri/resources/backend"

          # 1. 后端二进制存在
          if [ "${{ matrix.platform.os }}" = "windows-latest" ]; then
            EXEC="$RES_DIR/criminal-llm.exe"
          else
            EXEC="$RES_DIR/criminal-llm"
          fi
          if [ ! -f "$EXEC" ]; then
            echo "❌ 后端可执行文件缺失: $EXEC"
            exit 1
          fi
          echo "✅ 后端可执行文件存在"

          # 2. _internal 目录存在（Python 依赖）
          if [ ! -d "$RES_DIR/_internal" ]; then
            echo "❌ _internal 目录缺失（Python 依赖未打包）"
            exit 1
          fi
          INTERNAL_COUNT=$(find "$RES_DIR/_internal" -type f | wc -l)
          echo "✅ _internal 目录存在（$INTERNAL_COUNT 个文件）"

          # 3. legal_db 存在
          if [ ! -d "$RES_DIR/legal_db" ]; then
            echo "❌ legal_db 目录缺失"
            exit 1
          fi
          echo "✅ legal_db 目录存在"

          # 4. 冒烟测试：跑打包产物二进制（而非源码），验证 PyInstaller 打包完整性
          echo "=== 冒烟测试：运行打包产物 ==="
          RES_DIR="frontend/src-tauri/resources/backend"
          if [ "${{ matrix.platform.os }}" = "windows-latest" ]; then
            EXEC_NAME="criminal-llm.exe"
          else
            EXEC_NAME="criminal-llm"
          fi
          # 切到 resources 目录，让二进制能找到 legal_db/_internal
          cd "$RES_DIR"
          chmod +x "$EXEC_NAME" 2>/dev/null || true
          ./"$EXEC_NAME" &
          BACKEND_PID=$!
          sleep 5
          for i in $(seq 1 25); do
            if curl -sf http://localhost:8080/api/health > /dev/null 2>&1; then
              echo "✅ 打包产物启动成功，health 响应 OK"
              kill $BACKEND_PID 2>/dev/null
              break
            fi
            if [ $i -eq 25 ]; then
              echo "❌ 打包产物 30 秒内未响应 health"
              kill $BACKEND_PID 2>/dev/null
              exit 1
            fi
            sleep 1
          done

      # ---- Tauri build ----
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: frontend/src-tauri
          args: ${{ matrix.platform.tauri-args }}

      # ---- DMG 格式防护：非 UDZO 自动转换（v1.8.9 曾产出裸 UDRW 致用户无法挂载） ----
      - name: Ensure DMG is UDZO format
        if: matrix.platform.os == 'macos-14'
        shell: bash
        run: |
          DMG_PATH=$(find frontend/src-tauri/target -name "*.dmg" | head -1)
          if [ -z "$DMG_PATH" ]; then
            echo "::error::未找到 DMG 产物"
            exit 1
          fi
          FORMAT=$(hdiutil imageinfo "$DMG_PATH" | grep '^Format:' | awk '{print $2}')
          echo "DMG 格式: $FORMAT"
          if [ "$FORMAT" != "UDZO" ]; then
            echo "⚠️ 非标准格式（$FORMAT），转换为 UDZO..."
            hdiutil convert "$DMG_PATH" -format UDZO -o "${DMG_PATH%.dmg}_udzo.dmg"
            mv "${DMG_PATH%.dmg}_udzo.dmg" "$DMG_PATH"
            echo "✅ 已转换: $(hdiutil imageinfo "$DMG_PATH" | grep '^Format:')"
          fi
          # 冒烟验证：能挂载才放行
          hdiutil attach "$DMG_PATH" -nobrowse -readonly
          hdiutil detach $(hdiutil info | grep -B5 "$DMG_PATH" | grep '^/dev/' | head -1 | awk '{print $1}') -quiet || true

      # ---- macOS 公证（可选） ----
      - name: Notarize macOS app
        if: matrix.platform.os == 'macos-14' && env.APPLE_ID != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo "开始 macOS 公证..."
          DMG_PATH=$(find frontend/src-tauri/target -name "*.dmg" | head -1)
          if [ -n "$DMG_PATH" ]; then
            xcrun notarytool submit "$DMG_PATH" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
            xcrun stapler staple "$DMG_PATH"
            echo "✅ 公证完成"
          fi

      # ---- Generate checksums ----
      - name: Generate checksums
        shell: bash
        run: |
          echo "=== 生成 SHA256 校验文件 ==="
          cd frontend/src-tauri/target
          # 只保留需要的产物：Windows .msi, macOS .dmg, Linux .deb
          find . -path "*/release/bundle/*" -type f \( -name "*.msi" -o -name "*.dmg" -o -name "*.deb" \) | while read f; do
            echo "$(sha256sum "$f" | head -c 64)  ${f#*/release/bundle/}"
          done | tee checksums.txt
          echo ""
          echo "=== 校验文件内容 ==="
          cat checksums.txt

      # ---- Upload artifacts ----
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            frontend/src-tauri/target/**/release/bundle/**/*.msi
            frontend/src-tauri/target/**/release/bundle/**/*.dmg
            frontend/src-tauri/target/**/release/bundle/**/*.deb
            frontend/src-tauri/target/checksums.txt
          draft: false
          prerelease: false
          generate_release_notes: true
