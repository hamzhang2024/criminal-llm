name: Release Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v1.0.10)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.platform.os }} (${{ matrix.platform.target }})
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            tauri-args: ""
          - os: macos-14
            target: aarch64-apple-darwin
            tauri-args: "--target aarch64-apple-darwin"

    runs-on: ${{ matrix.platform.os }}
    steps:
      - uses: actions/checkout@v4

      # ---- Rust ----
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      # ---- Node ----
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # ---- Python (backend) ----
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # ---- Frontend deps ----
      - name: Install frontend deps
        working-directory: frontend
        run: |
          npm install

      # ---- Backend deps ----
      - name: Install backend deps
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt

      # ---- Build frontend ----
      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # ---- Build backend ----
      - name: Build backend
        shell: bash
        run: |
          cd backend
          rm -rf build dist
          python -m PyInstaller --noconfirm criminal-llm.spec

      # ---- Copy backend build to Tauri resources ----
      - name: Prepare backend resources
        shell: bash
        run: |
          RES_DIR="frontend/src-tauri/resources/backend"
          mkdir -p "$RES_DIR"
          # Linux
          if [ -d "backend/dist" ]; then
            cp -r backend/dist/* "$RES_DIR/" 2>/dev/null || true
          fi
          # Windows
          if [ -d "backend/dist" ]; then
            cp -r backend/dist/* "$RES_DIR/" 2>/dev/null || true
          fi

      # ---- 验证构建完整性 ----
      - name: Verify build integrity
        shell: bash
        run: |
          echo "=== 验证后端构建产物 ==="
          RES_DIR="frontend/src-tauri/resources/backend"
          if [ "${{ matrix.platform.os }}" = "windows-latest" ]; then
            EXEC="$RES_DIR/criminal-llm.exe"
          else
            EXEC="$RES_DIR/criminal-llm"
          fi
          if [ -f "$EXEC" ]; then
            SIZE=$(stat -f%z "$EXEC" 2>/dev/null || stat -c%s "$EXEC" 2>/dev/null)
            echo "后端可执行文件: $EXEC ($SIZE bytes)"
            if [ "$SIZE" -lt 10485760 ]; then
              echo "❌ 后端可执行文件小于 10MB，可能打包不完整"
              exit 1
            fi
            echo "✅ 后端可执行文件大小正常"
          else
            echo "❌ 后端可执行文件缺失: $EXEC"
            exit 1
          fi

          echo ""
          echo "=== 验证 legal_db ==="
          if [ -d "$RES_DIR/legal_db" ]; then
            echo "✅ legal_db 目录存在"
            ls "$RES_DIR/legal_db/"
          else
            echo "❌ legal_db 目录缺失!"
            exit 1
          fi

          echo ""
          echo "=== 验证前端构建产物 ==="
          if [ -f "frontend/dist/index.html" ]; then
            echo "✅ dist/index.html 存在"
          else
            echo "❌ frontend/dist/index.html 缺失!"
            exit 1
          fi
          ASSETS_COUNT=$(ls frontend/dist/assets/*.js 2>/dev/null | wc -l)
          echo "✅ JS 资源文件数: $ASSETS_COUNT"
          if [ "$ASSETS_COUNT" -eq 0 ]; then
            echo "❌ JS 资源文件缺失!"
            exit 1
          fi

          echo ""
          echo "=== 全部完整性检查通过 ==="

      # ---- Tauri build ----
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: frontend/src-tauri
          args: ${{ matrix.platform.tauri-args }}

      # ---- Generate checksums ----
      - name: Generate checksums
        shell: bash
        run: |
          echo "=== 生成 SHA256 校验文件 ==="
          cd frontend/src-tauri/target
          find . -path "*/release/bundle/*" -type f \( -name "*.dmg" -o -name "*.app.tar.gz" -o -name "*.msi" -o -name "*.exe" \) | while read f; do
            echo "$(sha256sum "$f" | head -c 64)  ${f#*/release/bundle/}"
          done | tee checksums.txt
          echo ""
          echo "=== 校验文件内容 ==="
          cat checksums.txt

      # ---- Upload artifacts ----
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            frontend/src-tauri/target/**/release/bundle/**/*.exe
            frontend/src-tauri/target/**/release/bundle/**/*.msi
            frontend/src-tauri/target/**/release/bundle/**/*.dmg
            frontend/src-tauri/target/**/release/bundle/**/*.app.tar.gz
            frontend/src-tauri/target/checksums.txt
          draft: false
          prerelease: false
          generateReleaseNotes: true
